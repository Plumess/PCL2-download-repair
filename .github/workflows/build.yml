name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Windows packages
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Build installer and adapters
        run: ./scripts/build.ps1

      - name: Package public files
        run: ./scripts/package.ps1

      - name: Verify release package contents
        run: ./scripts/verify-package.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PCL2-download-repair-build-${{ github.run_id }}
          path: |
            dist/PCL2-download-repair-release-*.zip
            dist/update/manifest.json
            dist/update/*-adapter.dll
            dist/update/*-harmony.dll
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
